name=LynkTuyaLocal
version=1.1.0
author=Alex Fichter
maintainer=Alex Fichter <fichteralex@gmail.com>
sentence=Control Tuya devices from ESP32 over the local network, without the Tuya cloud.
paragraph=Implements the Tuya LAN protocol v3.4 and v3.5 directly over TCP: authentication handshake, session key generation, AES-ECB/HMAC-SHA256 (v3.4) and AES-GCM (v3.5) encryption, status requests and power on/off commands. Use TinyTuya to obtain the device IP and Local Key.
category=Communication
url=https://github.com/F1chter/LynkTuyaLocal
architectures=esp32
includes=LynkTuya.h
